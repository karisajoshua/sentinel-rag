[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-rag"
version = "0.1.0"
description = "Evidence-grounded AI repository intelligence platform."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1","pydantic-settings>=2.6,<3","uvicorn[standard]>=0.32,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1","pytest>=8.3,<9","ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
