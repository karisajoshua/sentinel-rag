[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-rag"
version = "0.1.0"
description = "Evidence-grounded AI repository intelligence platform."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1","pydantic-settings>=2.6,<3","uvicorn[standard]>=0.32,<1",
  "psycopg[binary]>=3.2,<4",
  "openai>=1.54,<3",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1","pytest>=8.3,<9","ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_rag"]
