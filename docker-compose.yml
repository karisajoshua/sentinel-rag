services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sentinelrag
      POSTGRES_USER: sentinelrag
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - sentinelrag_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  api:
    build: .
    environment:
      SENTINEL_DATABASE_URL: postgresql://sentinelrag:local-development-only@db:5432/sentinelrag
      SENTINEL_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  sentinelrag_data:
